name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller --onefile --name nh-api --hidden-import=nhentai.cli --hidden-import=nhentai.client --hidden-import=nhentai.config entry.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nh-api
        path: dist/nh-api.exe
